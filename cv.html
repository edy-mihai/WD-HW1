            <input type="date">


            <label for="project-tech">Primary tech</label>

                    <option value="c-c++">C/C++</option>
                    <option value="python">Python</option>
                </select>
                <span id="tech-error"></span>

            <label for="project-desc">Project description</label>
                <textarea id="project-desc" aria-describedby="desc-error" rows="4" cols="50"></textarea>
